<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appfigures KB Screenshot Tool</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 24px;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 17px;
      font-weight: 600;
      color: #111;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 13px;
      color: #999;
    }

    .drop-zone {
      border: 1.5px dashed rgba(34,139,244,0.35);
      border-radius: 12px;
      background: rgba(34,139,244,0.02);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: rgba(34,139,244,0.7);
      background: rgba(34,139,244,0.05);
    }

    .drop-icon { font-size: 28px; margin-bottom: 12px; color: rgba(34,139,244,0.45); }
    .drop-label { font-size: 14px; color: #555; margin-bottom: 6px; }
    .drop-sub { font-size: 12px; color: #bbb; }

    #file-input { display: none; }

    .result-section { margin-top: 0; }

    .output-img {
      width: 100%;
      border-radius: 10px;
      display: block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .dims {
      font-size: 11px;
      color: #ccc;
      margin-top: 8px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn {
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.1s;
      display: flex;
      align-items: center;
      gap: 6px;
      border: none;
    }

    .btn-download {
      background: rgba(34,139,244,0.9);
      color: #fff;
    }

    .btn-download:hover { background: rgba(34,139,244,1); }
    .btn-download:disabled { opacity: 0.5; cursor: default; }

    .btn-reset {
      background: #f0f0f0;
      color: #555;
    }

    .btn-reset:hover { background: #e8e8e8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>KB screenshot tool</h1>
      <p>Drop, paste (Cmd+V), or upload a screenshot — then download.</p>
    </div>

    <div class="drop-zone" id="drop-zone">
      <div class="drop-icon">↑</div>
      <div class="drop-label">Drop a screenshot here or click to upload</div>
      <div class="drop-sub">PNG, JPG, WebP — any size &nbsp;·&nbsp; or paste with Cmd+V / Ctrl+V</div>
      <input type="file" id="file-input" accept="image/*">
    </div>

    <div class="result-section" id="result-section" style="display:none">
      <img id="output-img" class="output-img" alt="Styled screenshot">
      <div class="dims" id="dims-label"></div>
      <div class="actions">
        <button class="btn btn-download" id="btn-download">↓ Download PNG</button>
        <button class="btn btn-reset" id="btn-reset">↩ New screenshot</button>
      </div>
    </div>
  </div>

  <script>
    var W = 2130, H = 1152, IMG_H = 960, R_OUTER = 24, R_IMG = 16;

    var dropZone = document.getElementById('drop-zone');
    var fileInput = document.getElementById('file-input');
    var resultSection = document.getElementById('result-section');
    var outputImg = document.getElementById('output-img');
    var dimsLabel = document.getElementById('dims-label');
    var btnDownload = document.getElementById('btn-download');
    var btnReset = document.getElementById('btn-reset');

    var renderedDataUrl = null;

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function renderCanvas(img) {
      var canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      var ctx = canvas.getContext('2d');

      ctx.save();
      roundRect(ctx, 0, 0, W, H, R_OUTER);
      ctx.clip();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
      var grad = ctx.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, 'rgba(34,139,244,0.02)');
      grad.addColorStop(1, 'rgba(34,139,244,0.07)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = 'rgba(34,139,244,0.10)';
      ctx.lineWidth = 1.5;
      roundRect(ctx, 0.75, 0.75, W - 1.5, H - 1.5, R_OUTER);
      ctx.stroke();
      ctx.restore();

      var imgW = Math.round((img.naturalWidth / img.naturalHeight) * IMG_H);
      var imgX = Math.round((W - imgW) / 2);
      var imgY = Math.round((H - IMG_H) / 2);

      var shadowCanvas = document.createElement('canvas');
      shadowCanvas.width = W;
      shadowCanvas.height = H;
      var sCtx = shadowCanvas.getContext('2d');

      var shadows = [
        { ox: 0,  oy: 1,   blur: 3,  color: 'rgba(12,13,14,0.05)' },
        { ox: 0,  oy: 1,   blur: 2,  color: 'rgba(12,13,14,0.10)' },
        { ox: 68, oy: 108, blur: 36, color: 'rgba(230,235,245,0.00)' },
        { ox: 25, oy: 39,  blur: 28, color: 'rgba(230,235,245,0.05)' },
        { ox: 11, oy: 17,  blur: 20, color: 'rgba(230,235,245,0.09)' },
        { ox: 3,  oy: 4,   blur: 11, color: 'rgba(230,235,245,0.10)' }
      ];

      shadows.forEach(function(s) {
        sCtx.save();
        sCtx.shadowOffsetX = s.ox;
        sCtx.shadowOffsetY = s.oy;
        sCtx.shadowBlur = s.blur;
        sCtx.shadowColor = s.color;
        roundRect(sCtx, imgX, imgY, imgW, IMG_H, R_IMG);
        sCtx.fillStyle = '#ffffff';
        sCtx.fill();
        sCtx.restore();
      });

      ctx.drawImage(shadowCanvas, 0, 0);

      ctx.save();
      roundRect(ctx, imgX, imgY, imgW, IMG_H, R_IMG);
      ctx.clip();
      ctx.drawImage(img, imgX, imgY, imgW, IMG_H);
      ctx.restore();

      return canvas.toDataURL('image/png');
    }

    function loadFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var imgW = Math.round((img.naturalWidth / img.naturalHeight) * IMG_H);
          dimsLabel.textContent = img.naturalWidth + ' x ' + img.naturalHeight + 'px original — rendered at ' + imgW + ' x ' + IMG_H + 'px';
          renderedDataUrl = renderCanvas(img);
          outputImg.src = renderedDataUrl;
          dropZone.style.display = 'none';
          resultSection.style.display = 'block';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    btnDownload.addEventListener('click', function() {
      if (!renderedDataUrl) return;
      btnDownload.disabled = true;
      btnDownload.textContent = 'Rendering...';
      setTimeout(function() {
        var a = document.createElement('a');
        a.href = renderedDataUrl;
        a.download = 'appfigures-kb-screenshot.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        btnDownload.disabled = false;
        btnDownload.textContent = '↓ Download PNG';
      }, 50);
    });

    btnReset.addEventListener('click', function() {
      resultSection.style.display = 'none';
      dropZone.style.display = 'block';
      fileInput.value = '';
      outputImg.src = '';
      renderedDataUrl = null;
    });

    dropZone.addEventListener('click', function() { fileInput.click(); });
    fileInput.addEventListener('change', function(e) { loadFile(e.target.files[0]); });
    dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', function(e) {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      loadFile(e.dataTransfer.files[0]);
    });

    document.addEventListener('paste', function(e) {
      var items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (var i = 0; i < items.length; i++) {
        if (items[i].type.startsWith('image/')) { loadFile(items[i].getAsFile()); break; }
      }
    });
  </script>
</body>
</html>
